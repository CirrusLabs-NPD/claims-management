# Claim Management System - full stack.
#
#   docker compose up --build
#
#   App         http://localhost:9000
#   Swagger UI  http://localhost:9000/swagger-ui.html
#   API direct  http://localhost:9090/api
#
# Sign in with biller / biller123.

services:
  db:
    image: postgres:17-alpine
    container_name: cms-db
    environment:
      POSTGRES_DB: ${DB_NAME:-claims}
      POSTGRES_USER: ${DB_USER:-claims}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claims}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Exposed only so you can inspect the schema with psql during a demo.
      - "${DB_PORT_HOST:-54321}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claims} -d ${DB_NAME:-claims}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: cms-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-claims}
      DB_USER: ${DB_USER:-claims}
      DB_PASSWORD: ${DB_PASSWORD:-claims}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-demo-secret-key-32b}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      # nginx proxies /api, so the browser only ever sees one origin.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${BACKEND_PORT:-9090}:9090"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cms-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    restart: unless-stopped

volumes:
  db_data:
