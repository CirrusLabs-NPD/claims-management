server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API is proxied under the same origin as the SPA. That is what removes
    # CORS from the picture entirely and keeps the backend URL out of the bundle.
    location /api/ {
        proxy_pass         http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }

    # API docs, proxied so they sit on the same host as everything else.
    location /swagger-ui/   { proxy_pass http://backend:9090/swagger-ui/; }
    location /swagger-ui.html { proxy_pass http://backend:9090/swagger-ui.html; }
    location /v3/api-docs   { proxy_pass http://backend:9090/v3/api-docs; }
    location /v3/api-docs/  { proxy_pass http://backend:9090/v3/api-docs/; }
    location /actuator/     { proxy_pass http://backend:9090/actuator/; }

    # SPA fallback: unknown paths return index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
